server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: yilian-clothing
  # Java 21 虚拟线程：JDBC 是阻塞 IO，平台线程池在 200 并发扫码时会排队；
  # 虚拟线程让"每请求一线程"的写法重新变得廉价（详见讲义 J9）。
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yilian_clothing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      maximum-pool-size: ${DB_POOL:20}
      minimum-idle: 4
      connection-timeout: 3000
      # 事务里做 Redis/MQ 调用会让连接被长时间占用，这里显式设短，逼出问题而不是掩盖问题
      leak-detection-threshold: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

app:
  jwt:
    # 生产必须从环境变量注入；下面是开发默认值，长度必须 >= 32 字节（HS256）
    secret: ${JWT_SECRET:yilian-clothing-dev-secret-key-please-change-in-production}
    ttl-seconds: 86400
  security:
    # 登录失败锁定：5 次 / 10 分钟
    login-max-fail: 5
    login-lock-seconds: 600
  stock:
    safety-stock-default: 1
    matrix-cache-seconds: 60
    open-order-timeout-minutes: 30
  offline:
    max-batch-items: 50
    token-ttl-seconds: 600
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /doc
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.yilian.clothing: INFO
    org.springframework.jdbc.core: INFO
