# 前端静态资源 + /api 反向代理。
#
# 为什么用同源反代而不是让前端直连后端地址：
# 1) 前端代码里不出现任何 IP/端口，换环境不用重新打包；
# 2) 不产生跨域，省掉 CORS 预检那一次往返（弱网下就是几百毫秒）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：找不到文件就回 index.html，否则刷新 /stock 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 扫码高峰时后端可能出现瞬时排队，超时给足 30 秒
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # 静态文件名带 hash，可以长缓存；index.html 必须不缓存，否则发版后用户看到旧页面
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
